name: Stars Counter
on:
  schedule:
    - cron: '*/10 * * * *'  # 每 10 分钟执行一次
  workflow_dispatch:
    inputs:
      check_now:
        description: 'Check stars immediately'
        required: false

jobs:
  count-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Latest Star Count
        run: |
          STARS=$(curl -s https://api.github.com/repos/jacky/openclaw-10k-stars | jq '.stargazers_count')
          echo "⭐ Current Stars: $STARS"
          echo "star_count=$STARS" >> $GITHUB_OUTPUT
          
          # 生成 Stars 增长报告
          cat > stars-report.md << EOF
# ⭐ GitHub Stars 增长报告
**采集时间**: $(date)
**Stars**: $STARS
**增长趋势**: 持续追踪中

## 📈 目标进度
- 当前目标：10,000 Stars
- 距离目标：$(echo "10000 - $STARS" | bc) Stars
- 完成度：$(echo "scale=2; $STARS * 100 / 10000" | bc)%

## 🎯 策略
- 零外部依赖，自给自足
- 病毒式传播
- 产品价值驱动

EOF
          cat stars-report.md

      - name: Upload Stars Report
        uses: actions/upload-artifact@v4
        with:
          name: stars-report
          path: stars-report.md
